<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>ORB + Camarilla Trading App</title> <style> body { font-family: Arial, sans-serif; background: #111827; color: white; margin: 0; padding: 20px; } .container { max-width: 600px; margin: auto; } h1 { text-align: center; margin-bottom: 25px; } .card { background: #1f2937; padding: 20px; border-radius: 12px; margin-bottom: 20px; } label { display: block; margin-top: 12px; margin-bottom: 5px; } input { width: 100%; box-sizing: border-box; padding: 12px; border-radius: 8px; border: none; font-size: 16px; } button { width: 100%; margin-top: 20px; padding: 14px; border: none; border-radius: 8px; background: #2563eb; color: white; font-size: 18px; cursor: pointer; } button:hover { background: #1d4ed8; } .levels { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; } .level { background: #374151; padding: 12px; border-radius: 8px; text-align: center; } .signal { text-align: center; font-size: 28px; font-weight: bold; padding: 20px; border-radius: 10px; margin-top: 20px; } .buy { background: #065f46; } .sell { background: #991b1b; } .wait { background: #92400e; } .note { font-size: 13px; color: #d1d5db; margin-top: 15px; line-height: 1.5; } </style> </head> <body> <div class="container"> <h1>📈 ORB + Camarilla Trading App</h1> <div class="card"> <h2>Market Data</h2> <label>Previous Day High</label> <input type="number" id="high" step="0.01" placeholder="Example: 25000"> <label>Previous Day Low</label> <input type="number" id="low" step="0.01" placeholder="Example: 24800"> <label>Previous Day Close</label> <input type="number" id="close" step="0.01" placeholder="Example: 24900"> <label>ORB High</label> <input type="number" id="orbHigh" step="0.01" placeholder="ORB High"> <label>ORB Low</label> <input type="number" id="orbLow" step="0.01" placeholder="ORB Low"> <label>Current Price</label> <input type="number" id="price" step="0.01" placeholder="Current Price"> <button onclick="calculate()">Calculate Signal</button> </div> <div class="card"> <h2>Camarilla Levels</h2> <div class="levels"> <div class="level"> <strong>R3</strong> <div id="r3">--</div> </div> <div class="level"> <strong>R4</strong> <div id="r4">--</div> </div> <div class="level"> <strong>S3</strong> <div id="s3">--</div> </div> <div class="level"> <strong>S4</strong> <div id="s4">--</div> </div> </div> </div> <div class="card"> <h2>Trading Signal</h2> <div id="signal" class="signal wait"> WAIT </div> <div class="note"> BUY condition: Current price breaks above ORB High and is above Camarilla R3. <br><br> SELL condition: Current price breaks below ORB Low and is below Camarilla S3. </div> </div> </div> <script> function calculate() { const high = parseFloat(document.getElementById("high").value); const low = parseFloat(document.getElementById("low").value); const close = parseFloat(document.getElementById("close").value); const orbHigh = parseFloat(document.getElementById("orbHigh").value); const orbLow = parseFloat(document.getElementById("orbLow").value); const price = parseFloat(document.getElementById("price").value); if ( isNaN(high) || isNaN(low) || isNaN(close) || isNaN(orbHigh) || isNaN(orbLow) || isNaN(price) ) { alert("Please enter all market values."); return; } const range = high - low; // Camarilla calculation const r3 = close + (range * 1.1 / 4); const r4 = close + (range * 1.1 / 2); const s3 = close - (range * 1.1 / 4); const s4 = close - (range * 1.1 / 2); document.getElementById("r3").innerText = r3.toFixed(2); document.getElementById("r4").innerText = r4.toFixed(2); document.getElementById("s3").innerText = s3.toFixed(2); document.getElementById("s4").innerText = s4.toFixed(2); const signal = document.getElementById("signal"); signal.className = "signal"; // BUY if (price > orbHigh && price > r3) { signal.innerText = "🟢 BUY"; signal.classList.add("buy"); } // SELL else if (price < orbLow && price < s3) { signal.innerText = "🔴 SELL"; signal.classList.add("sell"); } // WAIT else { signal.innerText = "🟡 WAIT"; signal.classList.add("wait"); } } </script> </body> </html>
