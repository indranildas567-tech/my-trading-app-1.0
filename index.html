<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ORB + Camarilla Trading App</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: #f4f6f8;
        margin: 0;
        padding: 20px;
    }

    .container {
        max-width: 900px;
        margin: auto;
    }

    h1 {
        text-align: center;
        color: #222;
    }

    .card {
        background: white;
        padding: 20px;
        margin-top: 20px;
        border-radius: 12px;
        box-shadow: 0 3px 12px rgba(0,0,0,0.10);
    }

    .grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 15px;
    }

    label {
        font-weight: bold;
        display: block;
        margin-bottom: 6px;
    }

    input {
        width: 100%;
        padding: 10px;
        box-sizing: border-box;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 16px;
    }

    button {
        width: 100%;
        padding: 13px;
        margin-top: 20px;
        background: #1976d2;
        color: white;
        border: none;
        border-radius: 7px;
        font-size: 17px;
        cursor: pointer;
    }

    button:hover {
        background: #125ca5;
    }

    .results {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
        margin-top: 20px;
    }

    .result {
        padding: 15px;
        background: #eef3f8;
        border-radius: 8px;
        text-align: center;
    }

    .result strong {
        display: block;
        font-size: 14px;
        margin-bottom: 5px;
    }

    .result span {
        font-size: 20px;
        font-weight: bold;
    }

    .signal {
        margin-top: 20px;
        padding: 18px;
        text-align: center;
        border-radius: 8px;
        font-size: 24px;
        font-weight: bold;
    }

    .buy {
        background: #d4edda;
        color: #155724;
    }

    .sell {
        background: #f8d7da;
        color: #721c24;
    }

    .wait {
        background: #fff3cd;
        color: #856404;
    }

    @media(max-width:600px) {
        .grid,
        .results {
            grid-template-columns: 1fr;
        }
    }
</style>
</head>

<body>

<div class="container">

<h1>📈 ORB + Camarilla Trading App</h1>

<div class="card">

    <h2>Market Data</h2>

    <div class="grid">

        <div>
            <label>Previous High</label>
            <input type="number" id="high" step="0.01">
        </div>

        <div>
            <label>Previous Low</label>
            <input type="number" id="low" step="0.01">
        </div>

        <div>
            <label>Previous Close</label>
            <input type="number" id="close" step="0.01">
        </div>

        <div>
            <label>Current Price</label>
            <input type="number" id="price" step="0.01">
        </div>

        <div>
            <label>ORB High</label>
            <input type="number" id="orbHigh" step="0.01">
        </div>

        <div>
            <label>ORB Low</label>
            <input type="number" id="orbLow" step="0.01">
        </div>

    </div>

    <button onclick="calculate()">Calculate</button>

</div>

<div class="card">

    <h2>📊 Camarilla Levels</h2>

    <div class="results">

        <div class="result">
            <strong>R3</strong>
            <span id="r3">-</span>
        </div>

        <div class="result">
            <strong>R4</strong>
            <span id="r4">-</span>
        </div>

        <div class="result">
            <strong>S3</strong>
            <span id="s3">-</span>
        </div>

        <div class="result">
            <strong>S4</strong>
            <span id="s4">-</span>
        </div>

    </div>

</div>

<div class="card">

    <h2>🎯 ORB Levels</h2>

    <div class="results">

        <div class="result">
            <strong>ORB High</strong>
            <span id="showOrbHigh">-</span>
        </div>

        <div class="result">
            <strong>ORB Low</strong>
            <span id="showOrbLow">-</span>
        </div>

    </div>

</div>

<div id="signal" class="signal wait">
    WAIT
</div>

</div>

<script>

function calculate() {

    const high = parseFloat(document.getElementById("high").value);
    const low = parseFloat(document.getElementById("low").value);
    const close = parseFloat(document.getElementById("close").value);
    const price = parseFloat(document.getElementById("price").value);
    const orbHigh = parseFloat(document.getElementById("orbHigh").value);
    const orbLow = parseFloat(document.getElementById("orbLow").value);

    if (
        isNaN(high) ||
        isNaN(low) ||
        isNaN(close) ||
        isNaN(price) ||
        isNaN(orbHigh) ||
        isNaN(orbLow)
    ) {
        alert("Please enter all market values.");
        return;
    }

    const range = high - low;

    // Camarilla formulas
    const r3 = close + (range * 1.1 / 4);
    const r4 = close + (range * 1.1 / 2);

    const s3 = close - (range * 1.1 / 4);
    const s4 = close - (range * 1.1 / 2);

    document.getElementById("r3").innerText = r3.toFixed(2);
    document.getElementById("r4").innerText = r4.toFixed(2);
    document.getElementById("s3").innerText = s3.toFixed(2);
    document.getElementById("s4").innerText = s4.toFixed(2);

    document.getElementById("showOrbHigh").innerText =
        orbHigh.toFixed(2);

    document.getElementById("showOrbLow").innerText =
        orbLow.toFixed(2);

    const signal = document.getElementById("signal");

    signal.className = "signal wait";

    // ORB + Camarilla logic
    if (price > orbHigh && price > r3) {

        signal.innerText = "BUY 🚀";
        signal.className = "signal buy";

    } else if (price < orbLow && price < s3) {

        signal.innerText = "SELL 🔻";
        signal.className = "signal sell";

    } else {

        signal.innerText = "WAIT ⏳";
        signal.className = "signal wait";

    }

}

</script>

</body>
</html>
